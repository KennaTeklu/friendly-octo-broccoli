org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.compiler.execution.strategy=in-process

# FONT FIX (crash: Resources$NotFoundException Font resource ID #0x7f05000f)
# Disable the aapt2 "optimize" pass on release builds: it rewrites resources.arsc
# (name collapsing / path shortening) and has been observed to break Compose
# blocking font lookups by ID on some Android 14 devices. Plain deterministic table.
android.enableResourceOptimizations=false
android.enableResourceShrinking=false
org.gradle.java.home=/home/z/my-project/env/jdk-17.0.20.1+1
